<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 960" width="1380" height="960" font-family="'Segoe UI', Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1e40af"/>
    </marker>
    <marker id="arr-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <marker id="arr-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
    <marker id="arr-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#047857"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1380" height="960" fill="#f8fafc"/>

  <!-- Title -->
  <text x="690" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f172a">Zero-Trust AI Gateway — POST /api/chat Request Flow</text>

  <!-- Section bands -->
  <rect x="0" y="160" width="1380" height="225" fill="#fef3c7" opacity="0.55"/>
  <text x="8" y="176" font-size="10" fill="#92400e" font-weight="bold" letter-spacing="1">SECURITY</text>

  <rect x="0" y="400" width="1380" height="235" fill="#ede9fe" opacity="0.55"/>
  <text x="8" y="416" font-size="10" fill="#5b21b6" font-weight="bold" letter-spacing="1">CLASSIFICATION &amp; ROUTING</text>

  <rect x="0" y="648" width="1380" height="115" fill="#d1fae5" opacity="0.55"/>
  <text x="8" y="664" font-size="10" fill="#065f46" font-weight="bold" letter-spacing="1">LLM CALL</text>

  <rect x="0" y="776" width="1380" height="120" fill="#dbeafe" opacity="0.55"/>
  <text x="8" y="792" font-size="10" fill="#1e40af" font-weight="bold" letter-spacing="1">RESPONSE</text>

  <!-- ═══════════════ ACTOR BOXES TOP ═══════════════ -->

  <!-- Client x=75 -->
  <rect x="10" y="48" width="130" height="46" rx="5" fill="#1e3a8a"/>
  <text x="75" y="76" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Client</text>

  <!-- ChatController x=245 -->
  <rect x="162" y="48" width="166" height="46" rx="5" fill="#1e3a8a"/>
  <text x="245" y="68" text-anchor="middle" fill="white" font-size="11" font-weight="bold">ChatController</text>
  <text x="245" y="84" text-anchor="middle" fill="#93c5fd" font-size="10">POST /api/chat</text>

  <!-- BlocklistService x=415 -->
  <rect x="340" y="48" width="150" height="46" rx="5" fill="#1e3a8a"/>
  <text x="415" y="68" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Blocklist</text>
  <text x="415" y="84" text-anchor="middle" fill="#93c5fd" font-size="10">Service</text>

  <!-- JailbreakDetection x=580 -->
  <rect x="505" y="48" width="150" height="46" rx="5" fill="#1e3a8a"/>
  <text x="580" y="68" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Jailbreak</text>
  <text x="580" y="84" text-anchor="middle" fill="#93c5fd" font-size="10">Detection</text>

  <!-- PiiDetection x=740 -->
  <rect x="670" y="48" width="140" height="46" rx="5" fill="#1e3a8a"/>
  <text x="740" y="68" text-anchor="middle" fill="white" font-size="11" font-weight="bold">PII</text>
  <text x="740" y="84" text-anchor="middle" fill="#93c5fd" font-size="10">Detection</text>

  <!-- QueryClassifier x=905 -->
  <rect x="828" y="48" width="154" height="46" rx="5" fill="#6d28d9"/>
  <text x="905" y="68" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Query</text>
  <text x="905" y="84" text-anchor="middle" fill="#ddd6fe" font-size="10">Classifier</text>

  <!-- ModelRouter x=1065 -->
  <rect x="988" y="48" width="154" height="46" rx="5" fill="#6d28d9"/>
  <text x="1065" y="68" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Model</text>
  <text x="1065" y="84" text-anchor="middle" fill="#ddd6fe" font-size="10">Router</text>

  <!-- Ollama x=1250 -->
  <rect x="1185" y="48" width="130" height="46" rx="5" fill="#065f46"/>
  <text x="1250" y="68" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Ollama</text>
  <text x="1250" y="84" text-anchor="middle" fill="#6ee7b7" font-size="10">LLM Server</text>

  <!-- ═══════════════ LIFELINES ═══════════════ -->
  <line x1="75"   y1="94" x2="75"   y2="876" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="245"  y1="94" x2="245"  y2="876" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="415"  y1="94" x2="415"  y2="876" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="580"  y1="94" x2="580"  y2="876" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="740"  y1="94" x2="740"  y2="876" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="905"  y1="94" x2="905"  y2="876" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="1065" y1="94" x2="1065" y2="876" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="1250" y1="94" x2="1250" y2="876" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- ═══════════════ MESSAGES ═══════════════ -->

  <!-- 1. Client → ChatController: POST /api/chat -->
  <line x1="75" y1="140" x2="245" y2="140" stroke="#1e40af" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="160" y="134" text-anchor="middle" fill="#1e40af" font-size="11" font-weight="bold">POST /api/chat  {"prompt": "…"}</text>

  <!-- 2. ChatController → Blocklist -->
  <line x1="245" y1="183" x2="415" y2="183" stroke="#1e40af" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="330" y="177" text-anchor="middle" fill="#374151" font-size="11">isBlocked(prompt)</text>

  <!-- 3. Blocklist → ChatController: false -->
  <line x1="415" y1="216" x2="245" y2="216" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arr-gray)"/>
  <text x="330" y="210" text-anchor="middle" fill="#6b7280" font-size="11">false</text>

  <!-- 4. ChatController → JailbreakDetection -->
  <line x1="245" y1="256" x2="580" y2="256" stroke="#1e40af" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="413" y="250" text-anchor="middle" fill="#374151" font-size="11">isJailbreakAttempt(prompt)</text>

  <!-- 5. JailbreakDetection → ChatController: false -->
  <line x1="580" y1="290" x2="245" y2="290" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arr-gray)"/>
  <text x="413" y="284" text-anchor="middle" fill="#6b7280" font-size="11">false</text>

  <!-- 6. ChatController → PiiDetection: redact prompt -->
  <line x1="245" y1="330" x2="740" y2="330" stroke="#1e40af" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="493" y="324" text-anchor="middle" fill="#374151" font-size="11">redactPii(prompt)</text>

  <!-- 7. PiiDetection → ChatController: safePrompt -->
  <line x1="740" y1="363" x2="245" y2="363" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arr-gray)"/>
  <text x="493" y="357" text-anchor="middle" fill="#6b7280" font-size="11">safePrompt</text>

  <!-- 8. ChatController → QueryClassifier: classify -->
  <line x1="245" y1="420" x2="905" y2="420" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="575" y="414" text-anchor="middle" fill="#5b21b6" font-size="11" font-weight="bold">classify(safePrompt)</text>

  <!-- 9. QueryClassifier → Ollama: classification prompt via gemma3:1b -->
  <line x1="905" y1="458" x2="1250" y2="458" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="1078" y="452" text-anchor="middle" fill="#5b21b6" font-size="11">classify via gemma3:1b</text>

  <!-- 10. Ollama → QueryClassifier: "PROGRAMMING" -->
  <line x1="1250" y1="493" x2="905" y2="493" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arr-gray)"/>
  <text x="1078" y="487" text-anchor="middle" fill="#6b7280" font-size="11">"PROGRAMMING"</text>

  <!-- 11. QueryClassifier → ChatController: category -->
  <line x1="905" y1="528" x2="245" y2="528" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arr-gray)"/>
  <text x="575" y="522" text-anchor="middle" fill="#6b7280" font-size="11">QueryCategory.PROGRAMMING</text>

  <!-- 12. ChatController → ModelRouter: modelFor -->
  <line x1="245" y1="566" x2="1065" y2="566" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-purple)"/>
  <text x="655" y="560" text-anchor="middle" fill="#5b21b6" font-size="11" font-weight="bold">modelFor(PROGRAMMING)</text>

  <!-- 13. ModelRouter → ChatController: "codellama:7b" -->
  <line x1="1065" y1="600" x2="245" y2="600" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arr-gray)"/>
  <text x="655" y="594" text-anchor="middle" fill="#6b7280" font-size="11">"codellama:7b"</text>

  <!-- 14. ChatController → Ollama: processPrompt -->
  <line x1="245" y1="662" x2="1250" y2="662" stroke="#047857" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="748" y="655" text-anchor="middle" fill="#065f46" font-size="11" font-weight="bold">processPrompt(safePrompt, "codellama:7b")</text>

  <!-- 15. Ollama → ChatController: raw response -->
  <line x1="1250" y1="735" x2="245" y2="735" stroke="#047857" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arr-green)"/>
  <text x="748" y="729" text-anchor="middle" fill="#047857" font-size="11" font-weight="bold">raw LLM response</text>
  <!-- Timing note on Ollama side -->
  <rect x="1158" y="668" width="108" height="32" rx="3" fill="#a7f3d0" opacity="0.8"/>
  <text x="1212" y="682" text-anchor="middle" fill="#065f46" font-size="10">⏳ LLM inference</text>
  <text x="1212" y="694" text-anchor="middle" fill="#065f46" font-size="10">(may take seconds)</text>

  <!-- 16. ChatController → PiiDetection: redact response -->
  <line x1="245" y1="800" x2="740" y2="800" stroke="#1e40af" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="493" y="794" text-anchor="middle" fill="#374151" font-size="11">redactPii(response)</text>

  <!-- 17. PiiDetection → ChatController: safeResponse -->
  <line x1="740" y1="833" x2="245" y2="833" stroke="#6b7280" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arr-gray)"/>
  <text x="493" y="827" text-anchor="middle" fill="#6b7280" font-size="11">safeResponse</text>

  <!-- 18. ChatController → Client: final JSON response -->
  <line x1="245" y1="866" x2="75" y2="866" stroke="#047857" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arr-green)"/>
  <text x="160" y="860" text-anchor="middle" fill="#065f46" font-size="11" font-weight="bold">{ response, category }</text>

  <!-- ═══════════════ ACTOR BOXES BOTTOM ═══════════════ -->

  <rect x="10" y="878" width="130" height="46" rx="5" fill="#1e3a8a"/>
  <text x="75" y="906" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Client</text>

  <rect x="162" y="878" width="166" height="46" rx="5" fill="#1e3a8a"/>
  <text x="245" y="898" text-anchor="middle" fill="white" font-size="11" font-weight="bold">ChatController</text>
  <text x="245" y="914" text-anchor="middle" fill="#93c5fd" font-size="10">POST /api/chat</text>

  <rect x="340" y="878" width="150" height="46" rx="5" fill="#1e3a8a"/>
  <text x="415" y="898" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Blocklist</text>
  <text x="415" y="914" text-anchor="middle" fill="#93c5fd" font-size="10">Service</text>

  <rect x="505" y="878" width="150" height="46" rx="5" fill="#1e3a8a"/>
  <text x="580" y="898" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Jailbreak</text>
  <text x="580" y="914" text-anchor="middle" fill="#93c5fd" font-size="10">Detection</text>

  <rect x="670" y="878" width="140" height="46" rx="5" fill="#1e3a8a"/>
  <text x="740" y="898" text-anchor="middle" fill="white" font-size="11" font-weight="bold">PII</text>
  <text x="740" y="914" text-anchor="middle" fill="#93c5fd" font-size="10">Detection</text>

  <rect x="828" y="878" width="154" height="46" rx="5" fill="#6d28d9"/>
  <text x="905" y="898" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Query</text>
  <text x="905" y="914" text-anchor="middle" fill="#ddd6fe" font-size="10">Classifier</text>

  <rect x="988" y="878" width="154" height="46" rx="5" fill="#6d28d9"/>
  <text x="1065" y="898" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Model</text>
  <text x="1065" y="914" text-anchor="middle" fill="#ddd6fe" font-size="10">Router</text>

  <rect x="1185" y="878" width="130" height="46" rx="5" fill="#065f46"/>
  <text x="1250" y="898" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Ollama</text>
  <text x="1250" y="914" text-anchor="middle" fill="#6ee7b7" font-size="10">LLM Server</text>

  <!-- ═══════════════ LEGEND ═══════════════ -->
  <text x="690" y="950" text-anchor="middle" fill="#64748b" font-size="10">
    Solid arrows: calls / requests  ·  Dashed arrows: return values  ·  Blue: security pipeline  ·  Purple: classification &amp; routing  ·  Green: LLM interaction
  </text>
</svg>
