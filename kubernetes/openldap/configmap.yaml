apiVersion: v1
kind: ConfigMap
metadata:
  name: openldap-bootstrap
  namespace: ai-gateway
data:
  bootstrap.ldif: |
    # Groups organizational unit
    dn: ou=groups,dc=securellm,dc=com
    objectClass: organizationalUnit
    ou: groups

    # Free tier group
    dn: cn=free,ou=groups,dc=securellm,dc=com
    objectClass: groupOfNames
    cn: free
    member: cn=alice,ou=users,dc=securellm,dc=com

    # Premium tier group
    dn: cn=premium,ou=groups,dc=securellm,dc=com
    objectClass: groupOfNames
    cn: premium
    member: cn=bob,ou=users,dc=securellm,dc=com
