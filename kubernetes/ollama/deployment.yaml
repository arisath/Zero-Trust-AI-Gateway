apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ai-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 16Gi
          # Uncomment to request a GPU (requires nvidia-device-plugin in the cluster)
          # resources:
          #   limits:
          #     nvidia.com/gpu: "1"
          volumeMounts:
            - name: data
              mountPath: /root/.ollama
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ollama-data
      # Uncomment to pin Ollama to GPU nodes
      # nodeSelector:
      #   accelerator: nvidia
