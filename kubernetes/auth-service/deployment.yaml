apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: ai-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          # Replace with your registry path
          image: auth-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9000
          envFrom:
            - secretRef:
                name: auth-service-secret
          env:
            - name: AUTH_ISSUER_URI
              value: "http://auth-service:9000"
            - name: LDAP_URL
              value: "ldap://openldap:1389"
            - name: LDAP_BASE
              value: "dc=securellm,dc=com"
            - name: LDAP_MANAGER_DN
              value: "cn=admin,dc=securellm,dc=com"
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 9000
            initialDelaySeconds: 40
            periodSeconds: 30
