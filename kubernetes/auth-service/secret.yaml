# IMPORTANT: Do not commit real values to source control.
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: ai-gateway
type: Opaque
stringData:
  AUTH_CLIENT_ID: "ai-gateway-client"
  AUTH_CLIENT_SECRET: ""          # set a strong secret here
  LDAP_MANAGER_PASSWORD: ""       # must match LDAP_ADMIN_PASSWORD in openldap-secret
