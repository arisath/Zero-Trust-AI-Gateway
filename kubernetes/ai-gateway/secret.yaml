# IMPORTANT: Do not commit real values to source control.
# Either:
#   (a) fill in stringData values here and apply with kubectl, or
#   (b) use an external secrets manager (Vault, AWS Secrets Manager, Sealed Secrets, etc.)
apiVersion: v1
kind: Secret
metadata:
  name: ai-gateway-secret
  namespace: ai-gateway
type: Opaque
stringData:
  # Redis password — leave empty if Redis runs without auth
  REDIS_PASSWORD: ""
  # Production JWT settings — only needed when SPRING_PROFILES_ACTIVE=prod
  JWT_ISSUER_URI: ""
  JWT_JWKS_URI: ""
