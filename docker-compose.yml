services:

  # ── OpenLDAP (user directory) ─────────────────────────────────────────────
  openldap:
    image: bitnami/openldap:latest
    ports:
      - "1389:1389"
    environment:
      LDAP_ROOT: dc=securellm,dc=com
      LDAP_ADMIN_USERNAME: admin
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-adminpassword}
      # Seed two users: alice (free tier) and bob (premium tier)
      LDAP_USERS: alice,bob
      LDAP_PASSWORDS: ${LDAP_USER_PASSWORDS:-alice123,bob123}
      # bootstrap.ldif adds ou=groups and assigns each user to free/premium group
      LDAP_CUSTOM_LDIF_DIR: /ldifs
    volumes:
      - ./ldap/bootstrap.ldif:/ldifs/bootstrap.ldif:ro
      - openldap-data:/bitnami/openldap
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -H ldap://localhost:1389 -x -D cn=admin,dc=securellm,dc=com -w ${LDAP_ADMIN_PASSWORD:-adminpassword} -b dc=securellm,dc=com > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── phpLDAPadmin (LDAP web UI) ────────────────────────────────────────────
  phpldapadmin:
    image: osixia/phpldapadmin:latest
    ports:
      - "8090:80"
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: openldap
      PHPLDAPADMIN_HTTPS: "false"
    depends_on:
      openldap:
        condition: service_healthy
    restart: on-failure

  # ── Auth Service ─────────────────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    ports:
      - "9000:9000"
    environment:
      AUTH_ISSUER_URI: http://auth-service:9000
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID:-ai-gateway-client}
      AUTH_CLIENT_SECRET: ${AUTH_CLIENT_SECRET:-secret}
      LDAP_URL: ldap://openldap:1389
      LDAP_BASE: dc=securellm,dc=com
      LDAP_MANAGER_DN: cn=admin,dc=securellm,dc=com
      LDAP_MANAGER_PASSWORD: ${LDAP_ADMIN_PASSWORD:-adminpassword}
    depends_on:
      openldap:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── AI Gateway ────────────────────────────────────────────────────────────
  ai-gateway:
    build:
      context: .
      dockerfile: ai-gateway/Dockerfile
    ports:
      - "8081:8081"
    environment:
      # Use 'prod' to enforce JWT validation; 'local' disables auth entirely
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      JWT_ISSUER_URI: http://auth-service:9000
      JWT_JWKS_URI: http://auth-service:9000/oauth2/jwks

      # Ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CLASSIFIER_MODEL: ${OLLAMA_CLASSIFIER_MODEL:-gemma3:1b}
      OLLAMA_MODEL_PROGRAMMING: ${OLLAMA_MODEL_PROGRAMMING:-codellama:7b}
      OLLAMA_MODEL_MATHEMATICS: ${OLLAMA_MODEL_MATHEMATICS:-qwen2.5-math:7b}
      OLLAMA_MODEL_HISTORY: ${OLLAMA_MODEL_HISTORY:-llama3.2:3b}
      OLLAMA_MODEL_SCIENCE: ${OLLAMA_MODEL_SCIENCE:-llama3.2:3b}
      OLLAMA_MODEL_CREATIVE_WRITING: ${OLLAMA_MODEL_CREATIVE_WRITING:-mistral:7b}
      OLLAMA_MODEL_LEGAL: ${OLLAMA_MODEL_LEGAL:-llama3.2:3b}
      OLLAMA_MODEL_MEDICAL: ${OLLAMA_MODEL_MEDICAL:-llama3.2:3b}
      OLLAMA_MODEL_GENERAL: ${OLLAMA_MODEL_GENERAL:-gemma3:1b}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-120}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Tier-based rate limits
      FREE_MAX_REQUESTS_PER_MINUTE: ${FREE_MAX_REQUESTS_PER_MINUTE:-10}
      FREE_MAX_TOKENS_PER_HOUR: ${FREE_MAX_TOKENS_PER_HOUR:-10000}
      PREMIUM_MAX_REQUESTS_PER_MINUTE: ${PREMIUM_MAX_REQUESTS_PER_MINUTE:-60}
      PREMIUM_MAX_TOKENS_PER_HOUR: ${PREMIUM_MAX_TOKENS_PER_HOUR:-100000}
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
      auth-service:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── RedisInsight (Redis web UI) ──────────────────────────────────────────
  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    depends_on:
      redis:
        condition: service_healthy
    restart: on-failure

  # ── Redis (rate limiting) ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    restart: on-failure
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Ollama (LLM server) ───────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: on-failure
    # GPU support (uncomment if you have an NVIDIA GPU + nvidia-container-toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  redis-data:
  ollama-data:
  openldap-data:
