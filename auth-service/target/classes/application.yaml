server:
  port: 9000

spring:
  application:
    name: auth-service

auth:
  issuer-uri: ${AUTH_ISSUER_URI:http://localhost:9000}

  # OAuth2 clients — override with AUTH_CLIENT_ID / AUTH_CLIENT_SECRET in prod
  clients:
    - id: ${AUTH_CLIENT_ID:ai-gateway-client}
      secret: ${AUTH_CLIENT_SECRET:secret}

ldap:
  url: ${LDAP_URL:ldap://localhost:389}
  base: ${LDAP_BASE:dc=securellm,dc=com}
  manager-dn: ${LDAP_MANAGER_DN:cn=admin,dc=securellm,dc=com}
  manager-password: ${LDAP_MANAGER_PASSWORD:adminpassword}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    ldap:
      enabled: false
