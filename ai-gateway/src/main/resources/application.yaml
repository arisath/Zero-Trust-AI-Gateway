server:
  port: 8081

spring:
  application:
    name: ai-gateway
  profiles:
    active: local

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s


gateway:
  token-guard:
    free:
      max-requests-per-minute: ${FREE_MAX_REQUESTS_PER_MINUTE:10}
      max-tokens-per-hour: ${FREE_MAX_TOKENS_PER_HOUR:10000}
    premium:
      max-requests-per-minute: ${PREMIUM_MAX_REQUESTS_PER_MINUTE:60}
      max-tokens-per-hour: ${PREMIUM_MAX_TOKENS_PER_HOUR:100000}
  jailbreak:
    enabled: ${JAILBREAK_DETECTION_ENABLED:true}
  pii:
    enabled: ${PII_REDACTION_ENABLED:true}
  blocklist:
    enabled: ${BLOCKLIST_ENABLED:true}
    file: ${BLOCKLIST_FILE:}

llm:
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:gemma3:1b}
    classifier-model: ${OLLAMA_CLASSIFIER_MODEL:gemma3:1b}
    timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:120}
    models:
      programming: ${OLLAMA_MODEL_PROGRAMMING:codellama:7b}
      mathematics: ${OLLAMA_MODEL_MATHEMATICS:qwen2.5-math:7b}
      history: ${OLLAMA_MODEL_HISTORY:llama3.2:3b}
      science: ${OLLAMA_MODEL_SCIENCE:llama3.2:3b}
      creative-writing: ${OLLAMA_MODEL_CREATIVE_WRITING:mistral:7b}
      legal: ${OLLAMA_MODEL_LEGAL:llama3.2:3b}
      medical: ${OLLAMA_MODEL_MEDICAL:llama3.2:3b}
      general: ${OLLAMA_MODEL_GENERAL:gemma3:1b}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
