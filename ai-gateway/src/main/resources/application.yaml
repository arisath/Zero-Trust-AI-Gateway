server:
  port: 8081

spring:
  application:
    name: ai-gateway
  profiles:
    active: local

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s


gateway:
  token-guard:
    max-tokens-per-hour: ${MAX_TOKENS_PER_HOUR:100000}
    max-requests-per-minute: ${MAX_REQUESTS_PER_MINUTE:60}
  jailbreak:
    enabled: ${JAILBREAK_DETECTION_ENABLED:true}
  pii:
    enabled: ${PII_REDACTION_ENABLED:true}

llm:
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:gemma3:1b}
    timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:120}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
